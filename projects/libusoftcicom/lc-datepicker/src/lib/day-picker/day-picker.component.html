<lc-calendar-grid
  [kind]="'day'"
  [headerType]="dayPanel"
  [control]="control"
  [rows]="calendarData"
  [weekdayLabels]="shortDaysOfWeek"
  [cellTemplate]="dayCell">
</lc-calendar-grid>

<ng-template #dayCell let-item let-rowIndex="rowIndex" let-columnIndex="columnIndex">
  <lc-day-picker-button
    [control]="control"
    [item]="item"
    [row]="rowIndex"
    [column]="columnIndex"
    (selected)="dateSelected.emit($event)"
    (preview)="datePreview.emit($event)">
  </lc-day-picker-button>
</ng-template>
