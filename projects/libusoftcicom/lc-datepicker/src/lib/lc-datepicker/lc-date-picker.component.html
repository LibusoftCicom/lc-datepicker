@if (opened) {
<div class="calendar">
    @if (linkedControl && activePanel === Panel.Day) {
    <lc-day-picker
        #linkedDayPicker
        [control]="linkedControl"
        (dateSelected)="selectRangeDate($event)"
        (datePreview)="previewRangeDate($event)">
    </lc-day-picker>
    } @else {
    <lc-active-calendar-panel
        [panel]="activePanel"
        [control]="linkedControl || control"
        [includeTimePanel]="true"
        [compactTime]="control.getViewOptions().compactTime"
        [showTimeLabel]="false">
    </lc-active-calendar-panel>
    }

    @if (calendarType === ECalendarType.DateTime) {
    <div class="dateTimeToggle">
        <lc-time-picker-compact [control]="control"></lc-time-picker-compact>
    </div>
    }
    <ng-container lc-date-picker-footer [control]="control"
        (confirm)="confirm()" (cancel)="config.setOpen(false)" (clear)="clear()"></ng-container>
</div>
<lc-calendar-background [control]="control"></lc-calendar-background>
}
