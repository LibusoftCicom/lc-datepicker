<lc-calendar-grid
  [kind]="'month'"
  [headerType]="monthPanel"
  [control]="control"
  [rows]="calendarData"
  [cellTemplate]="monthCell">
</lc-calendar-grid>

<ng-template #monthCell let-item let-rowIndex="rowIndex" let-columnIndex="columnIndex">
  <lc-month-picker-button
    [control]="control"
    [item]="item"
    [row]="rowIndex"
    [column]="columnIndex">
  </lc-month-picker-button>
</ng-template>
