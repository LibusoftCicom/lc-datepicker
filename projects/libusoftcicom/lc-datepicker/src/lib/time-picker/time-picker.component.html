<table #timePicker [attr.aria-label]="control.getLabels().timeLabel || 'Choose time'">
    <thead lc-date-picker-header [type]="0" [control]="control"></thead>
    <tbody [style.color]="panelTextColor">
    <tr>
        <td class="pullRight">
          <lc-time-spinner
            ariaLabel="hour"
            [value]="formattedHour"
            [control]="control"
            (incremented)="addHour()"
            (decremented)="subtractHour()"
            (scrolled)="hourScroll($event)">
          </lc-time-spinner>
        </td>
        <td class="divider">:</td>
        <td class="pullLeft">
          <lc-time-spinner
            ariaLabel="minute"
            [value]="formattedMinute"
            [control]="control"
            (incremented)="addMinute()"
            (decremented)="subtractMinute()"
            (scrolled)="minuteScroll($event)">
          </lc-time-spinner>
        </td>
        <td>
          @if (hourFormat === EHourFormat.TWELVE_HOUR) {
          <lc-time-spinner
            ariaLabel="AM/PM"
            [value]="formattedAMPM"
            [control]="control"
            (incremented)="toggleMeridiem()"
            (decremented)="toggleMeridiem()"
            (scrolled)="scrollMeridiem($event)">
          </lc-time-spinner>
          }
        </td>
    </tr>
    </tbody>
</table>
