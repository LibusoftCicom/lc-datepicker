<div #timeSpinner class="time-spinner">
    <div #timeDigit class="timeLabel" [style.color]="valueColor">{{value}}</div>
    <div class="arrows">
        <button type="button" #upArrowButton class="selectbtn" [style.color]="arrowColor"
            [attr.aria-label]="'Increase ' + ariaLabel + ' ' + value">
            <i class="fa fa-caret-up fa-2x" aria-hidden="true"></i>
        </button>
        <button type="button" #downArrowButton class="selectbtn" [style.color]="arrowColor"
            [attr.aria-label]="'Decrease ' + ariaLabel + ' ' + value">
            <i class="fa fa-caret-down fa-2x" aria-hidden="true"></i>
        </button>
    </div>

</div>
