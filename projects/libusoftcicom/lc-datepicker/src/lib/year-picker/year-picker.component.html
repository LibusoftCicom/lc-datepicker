<lc-calendar-grid
  [kind]="'year'"
  [headerType]="yearPanel"
  [control]="control"
  [rows]="calendarData"
  [cellTemplate]="yearCell">
</lc-calendar-grid>

<ng-template #yearCell let-item let-rowIndex="rowIndex" let-columnIndex="columnIndex">
  <lc-year-picker-button
    [control]="control"
    [item]="item"
    [row]="rowIndex"
    [column]="columnIndex">
  </lc-year-picker-button>
</ng-template>
