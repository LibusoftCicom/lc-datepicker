<div
  class="calendar-cell"
  [class.has-events]="hasEvents"
  [attr.title]="eventTooltip"
  [class.day-cell]="kind === 'day'"
  [class.month-cell]="kind === 'month'"
  [class.year-cell]="kind === 'year'"
  [class.active]="item?.active"
  [class.disabled]="item?.disabled"
  [class.current]="item?.current"
  [class.outside-month]="kind === 'day' && item?.outsideMonth"
  [class.range-start]="item?.rangeStart"
  [class.range-end]="item?.rangeEnd"
  [class.in-range]="item?.inRange"
  [class.range-preview]="item?.rangePreview">
  <button
    type="button"
    [disabled]="item?.disabled"
    [attr.aria-label]="ariaLabel"
    [attr.aria-description]="eventTooltip"
    [attr.aria-current]="kind === 'day' && item?.current ? 'date' : null"
    [attr.aria-pressed]="!!item?.active || !!item?.rangeStart || !!item?.rangeEnd"
    [style.color]="textColor"
    (mouseenter)="hover.emit()"
    (mouseleave)="hoverEnd.emit()"
    (click)="select()">{{ item?.text ?? item?.value }}</button>
</div>
